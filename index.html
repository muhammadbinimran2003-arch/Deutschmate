</head>
<body>
<div id="app"></div>
<script type="module">
const DAY = 86400000;
const KEY = 'deutschmate.v1';
const CFG_KEY = 'deutschmate.config.v1';

const normalize = s => String(s || '')
  .toLocaleLowerCase('de')
  .normalize('NFC')
  .trim()
  .replace(/[.!?]+$/, '')
  .replace(/\s+/g, ' ');

function createWord(german, english, now = Date.now(), source = 'manual') {
  return {
    id: (globalThis.crypto?.randomUUID?.() || 'word-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2)),
    german: String(german).trim(),
    english: String(english).trim(),
    level: 0,
    errors: 0,
    reviews: 0,
    due: now,
    added: now,
    source
  };
}

function review(word, correct, now = Date.now()) {
  const level = correct ? Math.min(6, word.level + 1) : Math.max(0, word.level - 1);
  const intervals = [0, 1, 3, 7, 14, 30, 60];
  return {
    ...word,
    level,
    errors: word.errors + (correct ? 0 : 1),
    reviews: word.reviews + 1,
    due: now + (correct ? intervals[level] * DAY : 10 * 60000),
    updatedAt: now
  };
}

function practiceWords(words, now = Date.now()) {
  return [...words].sort((a, b) =>
    (b.errors * 4 + (6 - b.level) + (b.due <= now ? 5 : 0)) -
    (a.errors * 4 + (6 - a.level) + (a.due <= now ? 5 : 0)) ||
    a.added - b.added
  );
}

const chapters = [
  {
    id: 'a1-1',
    level: 'A1',
    title: 'Hallo, Welt!',
    topic: 'Greetings & introductions',
    lesson: 'Say Hallo (hello), Guten Morgen (good morning), and Tschüss (bye). Introduce yourself with Ich heiße … (My name is …). Ask Wie heißt du? (What is your name?).',
    question: 'Complete: Ich ___ Sara. (My name is Sara.)',
    answer: 'heiße',
    alternatives: ['heisse'],
    words: [['Hallo', 'hello'], ['Guten Morgen', 'good morning'], ['Tschüss', 'bye']]
  },
  {
    id: 'a1-2',
    level: 'A1',
    title: 'Meine kleine Welt',
    topic: 'People & family',
    lesson: 'German nouns always have articles: der Vater (the father), die Mutter (the mother), das Kind (the child). Learn every noun together with its article. Mein Vater means my father; meine Mutter means my mother.',
    question: 'Give the German for “the mother” (include the article).',
    answer: 'die Mutter',
    words: [['die Mutter', 'the mother'], ['der Vater', 'the father'], ['das Kind', 'the child']]
  },
  {
    id: 'a1-3',
    level: 'A1',
    title: 'Ein Kaffee, bitte',
    topic: 'Food & everyday requests',
    lesson: 'Use Ich möchte … (I would like …) for polite everyday requests: Ich möchte einen Kaffee, bitte. Danke means thank you, and Die Rechnung, bitte means the bill, please.',
    question: 'Which word means “please”?',
    answer: 'bitte',
    words: [['bitte', 'please'], ['das Wasser', 'the water'], ['der Kaffee', 'the coffee']]
  },
  {
    id: 'a2-1',
    level: 'A2',
    title: 'Gestern & heute',
    topic: 'Talking about the past',
    lesson: 'The conversational past (Perfekt) combines haben or sein with a past participle at the end of the clause. Ich habe Deutsch gelernt (I learned German). For movement or change of state: Ich bin nach Berlin gefahren (I traveled to Berlin).',
    question: 'Complete: Ich ___ Deutsch gelernt.',
    answer: 'habe',
    words: [['lernen', 'to learn'], ['gestern', 'yesterday'], ['heute', 'today']]
  },
  {
    id: 'a2-2',
    level: 'A2',
    title: 'Unterwegs',
    topic: 'Travel & directions',
    lesson: 'Ask Wo ist der Bahnhof? (Where is the train station?). Links means left, rechts means right, and geradeaus means straight ahead. Ich fahre mit dem Zug means I travel by train.',
    question: 'Give the German for “straight ahead”.',
    answer: 'geradeaus',
    words: [['der Bahnhof', 'the train station'], ['geradeaus', 'straight ahead'], ['der Zug', 'the train']]
  },
  {
    id: 'a2-3',
    level: 'A2',
    title: 'Weil ich Deutsch mag',
    topic: 'Reasons & connected sentences',
    lesson: 'Weil means because. In a weil subordinate clause, the conjugated verb moves to the very end: Ich lerne Deutsch, weil ich in Berlin wohne. (I learn German because I live in Berlin.)',
    question: 'Complete: … weil ich in Berlin ___. (live)',
    answer: 'wohne',
    words: [['weil', 'because'], ['wohnen', 'to live'], ['verstehen', 'to understand']]
  }
];

function demoReply(message, words) {
  const s = normalize(message);
  if (s.includes('ich bin gut')) {
    return 'Kleiner Tipp: “Mir geht es gut” is the natural German way to say “I’m doing well.” (“Ich bin gut” sounds like “I am skilled”). Wie geht es dir heute?';
  }
  if (s.includes('hallo') || s.includes('hello') || s.includes('guten tag')) {
    return 'Hallo! Schön, dass du da bist. Stell dich gerne auf Deutsch vor: “Ich heiße … und ich lerne Deutsch.”';
  }
  if (s.includes('help') || s.includes('hilfe')) {
    return 'Probier diesen Satz im Café: “Ich möchte einen Kaffee, bitte.” (I would like a coffee, please.) Wie würdest du Tee bestellen?';
  }
  const matched = words.find(w => s.includes(normalize(w.german)));
  if (matched) {
    return `Super! Du hast „${matched.german}“ (${matched.english}) benutzt. Schreib noch einen kurzen Satz damit — oder verbinde deinen Gemini API-Schlüssel oben unter „AI & Sync“ für echte KI-Gespräche.`;
  }
  const target = words[0];
  return `Lass uns ${target ? `„${target.german}“ (${target.english})` : 'deine ersten Sätze'} üben! Schreib einen kurzen deutschen Satz (oder verbinde oben unter „AI & Sync“ die Gemini API für echte Live-Konversationen).`;
}

const initial = () => ({
  version: 1,
  updatedAt: Date.now(),
  words: [
    createWord('der Alltag', 'everyday life'),
    createWord('gemütlich', 'cozy'),
    createWord('lernen', 'to learn'),
    createWord('die Reise', 'the journey'),
    createWord('zusammen', 'together')
  ],
  completed: [],
  chat: [],
  activity: []
});

const initialConfig = () => ({
  geminiKey: '',
  geminiModel: 'gemini-3.8-flash',
  autoSpeakTutor: true,
  speechRate: 0.95,
  supabaseUrl: '',
  supabaseAnonKey: ''
});

let state, config, storageError = false;
try {
  state = JSON.parse(localStorage.getItem(KEY));
  if (!state || state.version !== 1 || !Array.isArray(state.words) || !Array.isArray(state.completed) || !Array.isArray(state.chat)) {
    state = initial();
  }
  state.activity ??= [];
  state.updatedAt ??= Date.now();
} catch {
  state = initial();
  storageError = true;
}

try {
  config = { ...initialConfig(), ...(JSON.parse(localStorage.getItem(CFG_KEY)) || {}) };
  if (!config.geminiModel || config.geminiModel.startsWith('gemini-2.5')) {
    config.geminiModel = 'gemini-3.8-flash';
  }
} catch {
  config = initialConfig();
}

let flashDirection = 'en-de';
let page = 'home', feedback = '', cardId = null, revealed = false, practiceId = null, answered = false, lessonId = null;
let aiBusy = false, pdfBusy = false, isListening = false;
let pdfCandidates = [];
let pdfSummary = '';
let supabaseClient = null;
let currentUser = null;
let syncStatus = 'Local browser storage';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const syncChannel = ('BroadcastChannel' in globalThis) ? new BroadcastChannel('deutschmate_sync_v1') : null;
if (syncChannel) {
  syncChannel.onmessage = (ev) => {
    if (ev.data?.type === 'STATE_UPDATED' && ev.data.state && ev.data.state.updatedAt > (state.updatedAt || 0)) {
      state = ev.data.state;
      render();
    }
  };
}
window.addEventListener('storage', (ev) => {
  if (ev.key === KEY && ev.newValue) {
    try {
      const incoming = JSON.parse(ev.newValue);
      if (incoming && incoming.updatedAt >= (state.updatedAt || 0)) {
        state = incoming;
        render();
      }
    } catch {}
  }
});

function saveConfig() {
  try {
    localStorage.setItem(CFG_KEY, JSON.stringify(config));
  } catch {}
}

function save(pushCloud = true) {
  state.updatedAt = Date.now();
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    storageError = false;
    syncChannel?.postMessage({ type: 'STATE_UPDATED', state });
  } catch {
    storageError = true;
  }
  if (pushCloud && supabaseClient && currentUser) {
    pushStateToCloud();
  }
}

function record() {
  const date = new Date().toLocaleDateString('en-CA');
  if (!state.activity.includes(date)) state.activity.push(date);
  save();
}

const due = () => state.words.filter(w => w.due <= Date.now());
const mastered = () => state.words.filter(w => w.level >= 4).length;
const btn = (text, action, cls = '', extra = '') => `<button class="btn ${cls}" data-action="${action}" ${extra}>${text}</button>`;

function mergeStates(local, remote) {
  if (!remote || !Array.isArray(remote.words)) return local;
  const map = new Map();
  for (const w of [...remote.words, ...local.words]) {
    const key = normalize(w.german);
    const prev = map.get(key);
    if (!prev || (w.reviews || 0) > (prev.reviews || 0) || (w.updatedAt || 0) > (prev.updatedAt || 0)) {
      map.set(key, w);
    }
  }
  const completed = Array.from(new Set([...(remote.completed || []), ...(local.completed || [])]));
  const activity = Array.from(new Set([...(remote.activity || []), ...(local.activity || [])])).sort();
  const chat = (local.updatedAt || 0) >= (remote.updatedAt || 0) ? local.chat : (remote.chat || local.chat);
  return {
    version: 1,
    updatedAt: Math.max(local.updatedAt || 0, remote.updatedAt || 0, Date.now()),
    words: Array.from(map.values()),
    completed,
    activity,
    chat
  };
}

async function initSupabase() {
  if (!config.supabaseUrl || !config.supabaseAnonKey || !globalThis.supabase) return;
  try {
    supabaseClient = globalThis.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
    const { data: { session } } = await supabaseClient.auth.getSession();
    currentUser = session?.user || null;
    if (currentUser) {
      syncStatus = `Synced · ${currentUser.email}`;
      await pullStateFromCloud();
    }
    supabaseClient.auth.onAuthStateChange(async (_event, session) => {
      currentUser = session?.user || null;
      syncStatus = currentUser ? `Synced · ${currentUser.email}` : 'Local browser storage';
      if (currentUser) await pullStateFromCloud();
      render();
    });
    render();
  } catch (err) {
    console.warn('Supabase init notice:', err);
  }
}

async function pullStateFromCloud() {
  if (!supabaseClient || !currentUser) return;
  try {
    const { data, error } = await supabaseClient
      .from('user_state')
      .select('state')
      .eq('user_id', currentUser.id)
      .maybeSingle();
    if (!error && data?.state) {
      state = mergeStates(state, data.state);
      save(false);
      render();
    } else {
      await pushStateToCloud();
    }
  } catch {}
}

async function pushStateToCloud() {
  if (!supabaseClient || !currentUser) return;
  try {
    await supabaseClient
      .from('user_state')
      .upsert({ user_id: currentUser.id, state, updated_at: new Date().toISOString() });
    syncStatus = `Synced · ${currentUser.email}`;
  } catch {}
}

function speakGerman(text) {
  if (!('speechSynthesis' in globalThis) || !text) return;
  globalThis.speechSynthesis.cancel();
  const cleanText = String(text).replace(/[*_#`~]+/g, '').trim();
  const utter = new SpeechSynthesisUtterance(cleanText);
  utter.lang = 'de-DE';
  utter.rate = Number(config.speechRate) || 0.95;
  const voices = globalThis.speechSynthesis.getVoices();
  const deVoice = voices.find(v => v.lang.toLowerCase().startsWith('de') && /premium|enhanced|natural|anna|helena|petra|markus|google/i.test(v.name))
               || voices.find(v => v.lang.toLowerCase().startsWith('de'));
  if (deVoice) utter.voice = deVoice;
  globalThis.speechSynthesis.speak(utter);
}

let recognitionInstance = null;
function toggleVoiceInput(onTranscript) {
  const SpeechRec = globalThis.SpeechRecognition || globalThis.webkitSpeechRecognition;
  if (!SpeechRec) {
    feedback = 'Voice recognition is supported in Chrome, Edge, and Safari. Check microphone permissions.';
    render();
    return;
  }
  if (isListening && recognitionInstance) {
    recognitionInstance.stop();
    isListening = false;
    render();
    return;
  }
  recognitionInstance = new SpeechRec();
  recognitionInstance.lang = 'de-DE';
  recognitionInstance.interimResults = false;
  recognitionInstance.maxAlternatives = 1;
  isListening = true;
  render();

  recognitionInstance.onresult = (event) => {
    const transcript = event.results?.[0]?.[0]?.transcript || '';
    isListening = false;
    if (transcript) onTranscript(transcript);
    else render();
  };
  recognitionInstance.onerror = () => {
    isListening = false;
    feedback = 'Could not hear clearly. Try speaking in German again.';
    render();
  };
  recognitionInstance.onend = () => {
    isListening = false;
    render();
  };
  recognitionInstance.start();
}

async function callGeminiAPI({ systemInstruction, contents, responseJson = false }) {
  if (!config.geminiKey) throw new Error('NO_API_KEY');
  const primary = config.geminiModel || 'gemini-3.8-flash';
  const candidates = Array.from(new Set([primary, 'gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite']));
  const body = {
    contents,
    generationConfig: {
      temperature: responseJson ? 0.2 : 0.65
    }
  };
  if (systemInstruction) {
    body.systemInstruction = { parts: [{ text: systemInstruction }] };
  }
  if (responseJson) {
    body.generationConfig.responseMimeType = 'application/json';
  }

  let lastError = 'Gemini API request failed.';
  for (const model of candidates) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(config.geminiKey)}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (res.ok) {
      const data = await res.json();
      const text = data?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('') || '';
      if (text) return text;
      lastError = 'Empty response from Gemini API.';
      continue;
    }
    const errText = await res.text();
    lastError = `API error (${res.status}): ${errText.slice(0, 160)}`;
    if (res.status !== 503 && res.status !== 429) {
      throw new Error(lastError);
    }
  }
  throw new Error(lastError);
}

async function extractPdfText(file) {
  const pdfjsLib = globalThis['pdfjs-dist/build/pdf'] || globalThis.pdfjsLib;
  if (!pdfjsLib) throw new Error('PDF.js library is still loading. Please try again in a second.');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
  const maxPages = Math.min(pdf.numPages, 15);
  let fullText = '';
  for (let i = 1; i <= maxPages; i++) {
    const pageObj = await pdf.getPage(i);
    const content = await pageObj.getTextContent();
    fullText += content.items.map(item => item.str).join(' ') + '\n';
  }
  return { text: fullText.trim(), pages: pdf.numPages, scannedPages: maxPages };
}

function localExtractVocabFromText(rawText) {
  const results = [];
  const seen = new Set(state.words.map(w => normalize(w.german)));
  const lines = rawText.split(/[\r\n]+/);

  for (const line of lines) {
    const m = line.match(/^\s*([A-Za-zÄÖÜäöüß\s]{2,40})\s*(?:[-–—:=]|\t)\s*([A-Za-z,\s()to]{2,50})\s*$/);
    if (m) {
      const g = m[1].trim(), e = m[2].trim();
      const key = normalize(g);
      if (g && e && !seen.has(key) && results.length < 30) {
        seen.add(key);
        results.push({ german: g, english: e, selected: true });
      }
    }
  }

  const nounRegex = /\b(der|die|das)\s+([A-ZÄÖÜ][a-zäöüß]{2,25})\b/g;
  let match;
  while ((match = nounRegex.exec(rawText)) !== null && results.length < 25) {
    const phrase = `${match[1].toLowerCase()} ${match[2]}`;
    const key = normalize(phrase);
    if (!seen.has(key)) {
      seen.add(key);
      results.push({ german: phrase, english: '(add English meaning or connect AI)', selected: true });
    }
  }
  return results;
}

async function handlePdfUpload(file) {
  if (!file) return;
  pdfBusy = true;
  pdfCandidates = [];
  pdfSummary = `Reading "${file.name}"…`;
  render();
  try {
    const { text, pages, scannedPages } = await extractPdfText(file);
    if (!text || text.length < 10) {
      feedback = 'This PDF appears to contain scanned images rather than selectable text.';
      pdfBusy = false;
      pdfSummary = '';
      render();
      return;
    }

    if (config.geminiKey) {
      pdfSummary = `Analyzing ${scannedPages} of ${pages} page(s) with Gemini AI…`;
      render();
      const existingList = state.words.map(w => w.german).slice(0, 80).join(', ');
      const prompt = `You are a German vocabulary extraction assistant for a learner's personal app called DeutschMate.
Analyze the following PDF text and extract up to 20 of the most useful German vocabulary words or short phrases (A1–B1 level).
Rules:
1. For ALL German nouns, ALWAYS include the definite article ("der ", "die ", or "das ") in the "german" field, e.g. "der Alltag", "die Reise", "das Buch".
2. For verbs, give the infinitive in German and "to ..." in English.
3. Exclude words the user already has in their bank: [${existingList}].
4. Return a JSON array of objects with exact keys: [{"german": "der ...", "english": "the ..."}].

PDF TEXT (excerpt):
${text.slice(0, 18000)}`;

      const jsonText = await callGeminiAPI({
        contents: [{ role: 'user', parts: [{ text: prompt }] }],
        responseJson: true
      });
      const parsed = JSON.parse(jsonText);
      const list = Array.isArray(parsed) ? parsed : (parsed.words || []);
      const existingSet = new Set(state.words.map(w => normalize(w.german)));
      pdfCandidates = list
        .filter(item => item?.german && item?.english && !existingSet.has(normalize(item.german)))
        .map(item => ({
          german: String(item.german).trim(),
          english: String(item.english).trim(),
          selected: true
        }));
      pdfSummary = `AI extracted ${pdfCandidates.length} new vocabulary item(s) from "${file.name}". Review and save them below:`;
    } else {
      pdfCandidates = localExtractVocabFromText(text);
      pdfSummary = pdfCandidates.length
        ? `Found ${pdfCandidates.length} candidate item(s) from "${file.name}" using local pattern matching (connect your Gemini API key in "AI & Sync" for automatic AI translations):`
        : `Read "${file.name}", but no structured word pairs were detected locally. Connect your Gemini API key in "AI & Sync" so AI can analyze any German PDF and translate new nouns with articles automatically.`;
    }
  } catch (err) {
    feedback = `PDF analysis error: ${err.message || 'Could not process PDF.'}`;
    pdfSummary = '';
  } finally {
    pdfBusy = false;
    render();
  }
}

                    ? `<span class="tag">✓ “${esc(sw.german)}” in bank</span>`
                    : `<button class="icon-btn" data-add-suggested-german="${esc(sw.german)}" data-add-suggested-english="${esc(sw.english)}">+ Save “${esc(sw.german)}” (${esc(sw.english)})</button>`
                ).join('') : ''}
              </div>
            ` : ''}
          </div>
        `).join('')}
      </div>
      <form id="chat-form">
        <input name="message" id="chat-input" aria-label="Message to German tutor" required maxlength="1000" placeholder="Schreib oder sprich etwas auf Deutsch…" ${aiBusy ? 'disabled' : ''}>
        <button type="button" class="btn ${isListening ? 'recording' : 'light'}" data-action="voice-chat" ${aiBusy ? 'disabled' : ''} title="Speak in German">
          ${isListening ? '⏹ Stop' : '🎤 Speak'}
        </button>
        <button class="btn" ${aiBusy ? 'disabled' : ''}>${aiBusy ? 'Thinking…' : 'Send ↗'}</button>
      </form>
    </section>`;
}

async function handleTutorMessage(userText) {
  state.chat.push({ role: 'user', text: userText });
  state.chat = state.chat.slice(-100);
  record();

  if (!config.geminiKey) {
    const reply = demoReply(userText, state.words);
    state.chat.push({ role: 'assistant', text: reply, speakText: reply });
    save();
    render();
    if (config.autoSpeakTutor) speakGerman(reply);
    return;
  }

  aiBusy = true;
  render();
  try {
    const priorityWords = practiceWords(state.words).slice(0, 12).map(w => `${w.german} (${w.english}, level ${w.level}/6, mistakes ${w.errors})`).join('; ');
    const completedTitles = chapters.filter(c => state.completed.includes(c.id)).map(c => `${c.level} ${c.title}`).join(', ') || 'None yet';
    const sysPrompt = `You are DeutschMate, a warm, encouraging, human-like personal German tutor (A1-A2 level).
You are directly synced with the learner's live learning data:
- Learner's priority vocabulary to reinforce: ${priorityWords || 'No words saved yet'}
- Completed chapters: ${completedTitles}

Respond as a JSON object with this exact schema:
{
  "reply": "Your friendly response. Naturally weave in 1-2 of their saved German words when appropriate. If they made a German grammar, spelling, or article mistake, gently explain the correction in English and give the natural German phrasing, then ask a short follow-up question in simple German.",
  "germanSpeech": "Only the German sentences from your reply so the Text-to-Speech voice can read them aloud naturally with pure German pronunciation.",
  "suggestedWords": [
    {"german": "der Example", "english": "the example"}
  ]
}
Include 0 to 2 useful new German words from the conversation in "suggestedWords" (always include der/die/das for nouns) so the user can add them to their vocabulary bank with one click.`;

    const recentHistory = state.chat.slice(-10).map(m => ({
      role: m.role === 'user' ? 'user' : 'model',
      parts: [{ text: m.text }]
    }));

    const raw = await callGeminiAPI({
      systemInstruction: sysPrompt,
      contents: recentHistory,
      responseJson: true
    });
    let parsed;
    try {
      parsed = JSON.parse(raw);
    } catch {
      parsed = { reply: raw, germanSpeech: raw, suggestedWords: [] };
    }
    const replyText = parsed.reply || raw;
    const speakText = parsed.germanSpeech || replyText;
    const suggestedWords = Array.isArray(parsed.suggestedWords) ? parsed.suggestedWords.slice(0, 2) : [];

    state.chat.push({ role: 'assistant', text: replyText, speakText, suggestedWords });
    save();
    if (config.autoSpeakTutor) speakGerman(speakText);
  } catch (err) {
    const fallback = `AI connection notice: ${err.message}. Falling back to demo response:\n\n` + demoReply(userText, state.words);
    state.chat.push({ role: 'assistant', text: fallback });
    save();
  } finally {
    aiBusy = false;
    render();
    const log = $('#chatlog');
    if (log) log.scrollTop = log.scrollHeight;
  }
}

            </button>

              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 48 48">

                <path fill="#34A853" d="M24 45c5.6 0 10.3-1.8 13.8-5l-6.8-5.2c-1.9 1.3-4.3 2-7 2-5.4 0-10-3.7-11.7-8.7h-7v5.4C8.8 40.3 15.8 45 24 45Z"/>
                <path fill="#FBBC05" d="M12.3 28.1c-.9-2.6-.9-5.6 0-8.2v-5.4h-7a21 21 0 0 0 0 19Z"/>
                <path fill="#EA4335" d="M24 11.2c3 0 5.6 1 7.7 3l5.8-5.8C34 5 29.5 3 24 3 15.8 3 8.8 7.7 5.3 14.5l7 5.4c1.7-5 6.3-8.7 11.7-8.7Z"/>
              </svg>
              ${currentUser ? 'Signed in · Account' : 'Sign in with Google'}
            </button>
            <span class="pill">🌿 ${state.activity.length} ${state.activity.length === 1 ? 'day' : 'days'} practiced</span>
          </div>
        </header>
        ${storageError ? '<div role="alert" class="notice">Browser storage is unavailable or full. Export a backup; changes may not persist.</div>' : ''}
        ${({ home, vocabulary, practice, flashcards, chapters: chapterView, chat }[page])()}
        ${feedback ? `<div role="status" class="feedback">${esc(feedback)}</div>` : ''}

        <dialog id="settings-dialog" aria-labelledby="settings-title">
          <h2 id="settings-title">AI Tutor, PDF Analyzer & Cloud Sync</h2>
          <p class="muted">Connect a free Google Gemini API key to enable live talking AI conversations, automatic noun-article translation, and intelligent PDF vocabulary extraction. Keys are stored only in your own browser.</p>
          <form id="settings-form" style="flex-direction:column">
            <label class="field">Google Gemini API Key (from Google AI Studio)
              <input type="password" name="geminiKey" value="${esc(config.geminiKey)}" placeholder="AIzaSy...">
            </label>
            <label class="field">Gemini Model
              <select name="geminiModel">
                <option value="gemini-3.8-flash" ${config.geminiModel === 'gemini-3.8-flash' ? 'selected' : ''}>gemini-3.8-flash (Fast & recommended)</option>
                <option value="gemini-3.6-flash" ${config.geminiModel === 'gemini-3.6-flash' ? 'selected' : ''}>gemini-3.6-flash (Previous Flash)</option>
                <option value="gemini-3.5-flash-lite" ${config.geminiModel === 'gemini-3.5-flash-lite' ? 'selected' : ''}>gemini-3.5-flash-lite (Ultra-fast & light)</option>
              </select>
            </label>
            <label class="field">German Voice Speed (${config.speechRate}x)
              <input type="range" name="speechRate" min="0.7" max="1.2" step="0.05" value="${esc(config.speechRate)}">

            <p class="muted">Your vocabulary bank, spaced-repetition schedule, chapters, and tutor chat are synced with your cloud account.</p>
            <div class="actions">
              <button class="btn light" data-action="sign-out">Sign out</button>

          ` : `

              ? 'Your Supabase project is configured. Click below to launch Google OAuth sign-in.'
              : 'Your learning data is currently saved locally in this browser and synced across open tabs. To sign in with Google and sync across your Mac and iPhone, add your Supabase URL and Anon Key in ⚙️ AI & Sync.'}</p>
            <div class="actions">
              ${config.supabaseUrl && config.supabaseAnonKey
                ? btn('Continue with Google OAuth ↗', 'launch-google-oauth')
                : btn('⚙️ Open AI & Sync Settings', 'open-settings-from-auth', 'gold')}

function bind() {
  document.querySelectorAll('[data-action]').forEach(el => el.onclick = () => action(el.dataset.action));
  document.querySelectorAll('[data-lesson]').forEach(el => el.onclick = () => {
    lessonId = el.dataset.lesson;
    feedback = '';
    render();
  });
  document.querySelectorAll('[data-speak]').forEach(el => el.onclick = (e) => {
    e.stopPropagation();
    speakGerman(el.dataset.speak);
  });
  document.querySelectorAll('[data-add-suggested-german]').forEach(el => el.onclick = () => {
    const g = el.dataset.addSuggestedGerman;
    const en = el.dataset.addSuggestedEnglish;
    if (g && en && !state.words.some(w => normalize(w.german) === normalize(g))) {
      state.words.push(createWord(g, en, Date.now(), 'tutor'));
      save();
      feedback = `Added “${g}” (${en}) from Tutor Chat to your vocabulary bank and flashcards.`;
      render();
    }
  });
  document.querySelectorAll('[data-pdf-idx]').forEach(el => el.onchange = () => {
    const idx = Number(el.dataset.pdfIdx);
    if (pdfCandidates[idx]) pdfCandidates[idx].selected = el.checked;
  });
  const bindDeletes = () => {
    document.querySelectorAll('[data-delete]').forEach(el => el.onclick = () => {
      if (confirm('Delete this word and its review history?')) {
        state.words = state.words.filter(w => w.id !== el.dataset.delete);
        save();
        render();
      }
    });
  };
  bindDeletes();

  if ($('#search')) {
    $('#search').oninput = e => {
      const q = normalize(e.target.value);
      $('#word-rows').innerHTML = wordRows(state.words.filter(w => normalize(w.german + ' ' + w.english).includes(q)));
      bindDeletes();
      document.querySelectorAll('[data-speak]').forEach(el => el.onclick = () => speakGerman(el.dataset.speak));
    };
  }

  if ($('#toggle-autospeak')) {
    $('#toggle-autospeak').onchange = e => {
      config.autoSpeakTutor = e.target.checked;
      saveConfig();
    };
  }

  if ($('#pdf-upload')) {
    $('#pdf-upload').onchange = e => {
      const file = e.target.files?.[0];
      if (file) handlePdfUpload(file);
    };
  }

  if ($('#word-form')) {
    $('#word-form').onsubmit = async e => {
      e.preventDefault();
      const data = new FormData(e.target);
      let g = (data.get('german') || '').trim();
      let en = (data.get('english') || '').trim();
      if (!g) return;

      if (config.geminiKey && !en) {
        aiBusy = true;
        render();
        try {
          const res = await callGeminiAPI({
            contents: [{
              role: 'user',
              parts: [{
                text: `For the German word or phrase "${g}", return a JSON object {"german": "...", "english": "..."}. If it is a German noun, include the correct definite article (der, die, or das) in "german". Give a concise English translation in "english".`
              }]
            }],
            responseJson: true
          });
          const parsed = JSON.parse(res);
          if (parsed.german) g = String(parsed.german).trim();
          if (parsed.english) en = String(parsed.english).trim();
        } catch (err) {
          feedback = `Could not auto-translate "${g}": ${err.message}`;
        } finally {
          aiBusy = false;
        }
      }

      if (!en) {
        feedback = 'Please provide the English meaning (or connect your Gemini API key for automatic translation).';
        render();
        return;
      }

      if (state.words.some(w => normalize(w.german) === normalize(g))) {
        feedback = `“${g}” is already in your vocabulary bank.`;
      } else {
        state.words.push(createWord(g, en));
        save();
        feedback = `Saved “${g}” (${en}). It is immediately synced with Flashcards, Practice, and your AI Tutor.`;
      }
      render();
    };
  }

  if ($('#practice-form')) {
    $('#practice-form').onsubmit = e => {
      e.preventDefault();
      const w = state.words.find(x => x.id === practiceId);
      if (!w) return;
      const ans = new FormData(e.target).get('answer');
      const correct = normalize(ans) === normalize(w.german);
      state.words = state.words.map(v => v.id === w.id ? review(v, correct) : v);
      answered = true;
      feedback = correct
        ? `Richtig! “${w.german}” — your next review has been scheduled.`
        : `Fast! The correct answer is “${w.german}”. This word now gets extra priority in Practice and Flashcards.`;
      record();
      if (correct && config.autoSpeakTutor) speakGerman(w.german);
      render();
    };
  }

  if ($('#lesson-form')) {
    $('#lesson-form').onsubmit = e => {
      e.preventDefault();
      const c = chapters.find(x => x.id === lessonId);
      const a = normalize(new FormData(e.target).get('answer'));
      if ([c.answer, ...(c.alternatives || [])].some(v => normalize(v) === a)) {
        if (!state.completed.includes(c.id)) state.completed.push(c.id);
        record();
        feedback = 'Richtig! Chapter completed. Your progress is synced across Overview and your AI Tutor.';
      } else {
        feedback = `Try again. Hint: the answer is “${c.answer}”.`;
      }
      render();
    };
  }

  if ($('#chat-form')) {
    $('#chat-form').onsubmit = async e => {
      e.preventDefault();
      const text = (new FormData(e.target).get('message') || '').trim();
      if (!text || aiBusy) return;
      await handleTutorMessage(text);
    };
  }

  if ($('#settings-form')) {
    $('#settings-form').onsubmit = async e => {
      e.preventDefault();
      const data = new FormData(e.target);
      config.geminiKey = (data.get('geminiKey') || '').trim();
      config.geminiModel = data.get('geminiModel') || 'gemini-3.8-flash';
      config.speechRate = Number(data.get('speechRate')) || 0.95;
      config.supabaseUrl = (data.get('supabaseUrl') || '').trim();
      config.supabaseAnonKey = (data.get('supabaseAnonKey') || '').trim();
      saveConfig();
      $('#settings-dialog')?.close();
      feedback = config.geminiKey
        ? 'AI & Sync settings saved! Live Talking AI Tutor and AI PDF Analyzer are ready.'
        : 'Settings saved.';
      if (config.supabaseUrl && config.supabaseAnonKey) await initSupabase();
      render();
    };
  }

  if ($('#import')) $('#import').onchange = importBackup;
}

async function action(a) {
  if (a === 'google-sign-in') { $('#auth-dialog').showModal(); return; }
  if (a === 'close-auth') { $('#auth-dialog').close(); return; }
  if (a === 'open-settings') { $('#settings-dialog').showModal(); return; }
  if (a === 'open-settings-from-auth') { $('#auth-dialog').close(); $('#settings-dialog').showModal(); return; }
  if (a === 'close-settings') { $('#settings-dialog').close(); return; }
  if (a === 'test-voice') { speakGerman('Hallo! Ich bin dein persönlicher DeutschMate. Lass uns zusammen Deutsch lernen!'); return; }
  if (a === 'launch-google-oauth') {
    if (window.location.protocol === 'file:') {
      feedback = 'Google Sign-In requires a web URL (https:// or http://localhost) and cannot redirect back to a local file:// page. Deploy to Netlify Drop or run a local server first.';
      $('#auth-dialog')?.close();
      render();
      return;
    }
    if (!globalThis.supabase) {
      feedback = 'Cloud sync library could not load. Check your internet connection or ad-blocker.';
      $('#auth-dialog')?.close();
      render();
      return;
    }
    if (!supabaseClient) await initSupabase();
    if (supabaseClient) {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
      if (error) {
        feedback = `Google Sign-In error: ${error.message}`;
        $('#auth-dialog')?.close();
        render();
      }
    } else {
      feedback = 'Could not connect to Supabase. Double-check your Project URL and Anon Key in ⚙️ AI & Sync.';
      $('#auth-dialog')?.close();
      render();
    }
    return;
  }
  if (a === 'sign-out') {
    if (supabaseClient) await supabaseClient.auth.signOut();
    currentUser = null;
    syncStatus = 'Local browser storage';
    $('#auth-dialog')?.close();
    render();
    return;
  }
  if (a === 'voice-chat') {
    toggleVoiceInput(async (transcript) => {
      const input = $('#chat-input');
      if (input) input.value = transcript;
      await handleTutorMessage(transcript);
    });
    return;
  }
  if (a === 'voice-practice') {
    toggleVoiceInput((transcript) => {
      const input = $('#practice-input');
      if (input) {
        input.value = transcript;
        input.focus();
      }
    });
    return;
  }
  if (a === 'save-pdf-words') {
    const selected = pdfCandidates.filter(c => c.selected);
    let addedCount = 0;
    for (const item of selected) {
      if (!state.words.some(w => normalize(w.german) === normalize(item.german))) {
        state.words.push(createWord(item.german, item.english, Date.now(), 'pdf'));
        addedCount++;
      }
    }
    pdfCandidates = [];
    pdfSummary = '';
    save();
    feedback = `Added ${addedCount} new word(s) from your PDF! They are ready in Flashcards, Practice, and Tutor Chat.`;
    render();
    return;
  }
  if (a === 'clear-pdf-words') {
    pdfCandidates = [];
    pdfSummary = '';
    render();
    return;
  }
  if (a === 'direction-en' || a === 'direction-de') {
    flashDirection = a === 'direction-en' ? 'en-de' : 'de-en';
    revealed = false;
    feedback = '';
    render();
    return;
  }
  if (['home', 'vocabulary', 'practice', 'flashcards', 'chapters', 'chat'].includes(a)) {
    go(a);
    return;
  }
  if (a === 'reveal') {
    revealed = true;
    const w = state.words.find(x => x.id === cardId);
    if (w && config.autoSpeakTutor) speakGerman(w.german);
  }
  if (a === 'got' || a === 'again') {
    state.words = state.words.map(w => w.id === cardId ? review(w, a === 'got') : w);
    record();
    cardId = null;
    revealed = false;
  }
  if (a === 'next') {
    const list = practiceWords(state.words);
    practiceId = (list.find(w => w.id !== practiceId) || list[0])?.id;
    answered = false;
    feedback = '';
  }
  if (a === 'chapter-words') {
    const c = chapters.find(x => x.id === lessonId);
    let n = 0;
    c.words.forEach(([g, e]) => {
      if (!state.words.some(w => normalize(w.german) === normalize(g))) {
        state.words.push(createWord(g, e, Date.now(), 'chapter'));
        n++;
      }
    });
    save();
    feedback = `${n} new chapter word(s) added to your vocabulary bank and synced with Flashcards.`;
  }
  if (a === 'clear-chat' && confirm('Clear this conversation?')) {
    state.chat = [];
    save();
  }
  if (a === 'export') {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'deutschmate-backup.json';
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  render();
}

async function importBackup(e) {
  try {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2000000) throw Error();
    const s = JSON.parse(await file.text());
    if (s.version !== 1 || !Array.isArray(s.words) || !Array.isArray(s.completed) || !Array.isArray(s.chat) || !Array.isArray(s.activity)) throw Error();
    const ids = new Set();
    for (const w of s.words) {
      if (!w || typeof w.id !== 'string' || ids.has(w.id) || typeof w.german !== 'string' || !w.german.trim() || typeof w.english !== 'string' || !w.english.trim() || ![w.due, w.added, w.level, w.errors, w.reviews].every(Number.isFinite) || !Number.isInteger(w.level) || w.level < 0 || w.level > 6 || w.errors < 0 || w.reviews < 0) throw Error();
      ids.add(w.id);
    }
    if (!s.completed.every(id => chapters.some(c => c.id === id)) || !s.activity.every(d => typeof d === 'string') || !s.chat.every(m => m && ['user', 'assistant'].includes(m.role) && typeof m.text === 'string')) throw Error();
    if (confirm('Replace all current learning data with this backup?')) {
      state = s;
      save();
      feedback = 'Backup restored and synced across all sections.';
      render();
    }
  } catch {
    feedback = 'Invalid backup. Choose a DeutschMate JSON export (under 2 MB).';
    render();
  }
}

save(false);
render();
initSupabase();
